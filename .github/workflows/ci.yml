name: FixIt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  production-containers:
    name: Production container build and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.production.yml config --quiet
      - name: Build backend production image
        run: docker build --pull -f backend/Dockerfile -t fixit-backend:ci backend
      - name: Build frontend production image
        run: |
          docker build --pull \
            --build-arg VITE_PUBLIC_REGISTRATION_ENABLED=false \
            --build-arg VITE_DEMO_MODE_ENABLED=false \
            -f frontend/Dockerfile -t fixit-frontend:ci frontend
